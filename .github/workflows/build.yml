name: Build Mobile Harness Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Fetch native dependencies (uncommitted git submodules)
        # third_party/proot and third_party/libandroid-shmem are declared in
        # .gitmodules but their gitlinks are missing from this repository, so
        # CI would fail in the CMake step. Fetch them at the exact revisions
        # used by upstream for a reproducible build. Skipped when already
        # present (e.g. once the submodules are properly committed).
        run: |
          set -ex
          fetch_shallow() {
            dir="$1"; probe="$2"; url="$3"; ref="$4"
            if [ -e "$probe" ]; then return 0; fi
            rm -rf "$dir"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth 1 origin "$ref"
            git -C "$dir" checkout -q FETCH_HEAD
          }
          fetch_shallow third_party/proot third_party/proot/src/cli/proot.c \
            https://github.com/termux/proot.git 61681c6481197e3c0cec6726075053adb740f235
          fetch_shallow third_party/libandroid-shmem third_party/libandroid-shmem/shmem.c \
            https://github.com/termux/libandroid-shmem.git 7f0bd7e25dbdd146265aff7c6a890029e374622d
          test -f third_party/proot/src/cli/proot.c
          test -f third_party/libandroid-shmem/shmem.c

      - name: Accept Android SDK licenses
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses || true

      - name: Install Android SDK components (NDK / CMake / Platform / Build Tools)
        # The runner ships a preinstalled SDK. Install only the pinned versions
        # this project needs. AGP auto-installs anything still missing (licenses
        # are accepted above), so a failure here is not fatal.
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" || true
          ls "$ANDROID_SDK_ROOT/ndk" || true
          ls "$ANDROID_SDK_ROOT/cmake" || true

      - name: Setup Signing Keystore
        run: |
          keytool -genkey -v -keystore release.jks \
            -alias mobile-harness \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mhpass123 \
            -keypass mhpass123 \
            -dname "CN=MobileHarness, OU=MobileHarness, O=MobileHarness, L=Default, S=Default, C=US"
          echo "MH_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_STORE_PASSWORD=mhpass123" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_KEY_ALIAS=mobile-harness" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_KEY_PASSWORD=mhpass123" >> "$GITHUB_ENV"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Online APK (Release & Debug)
        run: |
          ./gradlew assembleOnlineRelease assembleOnlineDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          if [ -f app/build/outputs/apk/online/release/app-online-release.apk ]; then
            cp app/build/outputs/apk/online/release/app-online-release.apk artifacts/Mobile-Harness-release.apk
          fi
          if [ -f app/build/outputs/apk/online/debug/app-online-debug.apk ]; then
            cp app/build/outputs/apk/online/debug/app-online-debug.apk artifacts/Mobile-Harness-debug.apk
          fi
          echo "Generated APKs:"
          ls -lh artifacts/

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Harness-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}